<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>articul8 · cat</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #b3b3b3;
        --accent: #e6394a;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        font-weight: 300;
      }
      h1 { font-weight: 200; letter-spacing: 0.02em; }
      #stage svg { width: 100%; height: auto; }
      #stage { cursor: pointer; }
      .row { display: flex; align-items: center; gap: 12px; }
      .icon-btn {
        appearance: none;
        border: 0;
        background: none;
        padding: 6px;
        margin: 0;
        cursor: pointer;
        color: var(--muted);
        line-height: 0;
        transition: color 0.12s ease;
      }
      .icon-btn:hover { color: var(--ink); }
      .icon-btn svg { width: 26px; height: 26px; fill: currentColor; display: block; }
      .icon-btn.heart:hover,
      .icon-btn.heart:active { color: var(--accent); }
      #toggle .i-play { display: none; }
      #toggle[data-playing="false"] .i-stop { display: none; }
      #toggle[data-playing="false"] .i-play { display: block; }
      #scrub { flex: 1; accent-color: var(--ink); }
      #clock { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; }
      .hint { color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>articul8 — cat</h1>
    <div id="stage" style="width: 320px"></div>
    <p class="row" style="width: 320px">
      <button id="toggle" class="icon-btn" data-playing="true" aria-label="Pause" title="Pause">
        <svg class="i-stop" viewBox="-5 -10 110 135" aria-hidden="true"><path d="m75 91.668h-50c-9.2031 0-16.668-7.4609-16.668-16.668v-50c0-9.2031 7.4609-16.668 16.668-16.668h50c9.2031 0 16.668 7.4609 16.668 16.668v50c0 9.2031-7.4648 16.668-16.668 16.668z"/></svg>
        <svg class="i-play" viewBox="-5 -10 110 135" aria-hidden="true"><path d="M86.18,46.79c2.65,1.32,2.65,5.1,0,6.42L17.03,90.63c-2.39,1.2-5.2-.54-5.2-3.21V12.58c0-2.67,2.81-4.41,5.2-3.21L86.18,46.79Z"/></svg>
      </button>
      <input id="scrub" type="range" min="0" max="2000" value="0" />
      <span id="clock">0 ms</span>
    </p>
    <p class="row">
      <button id="love" class="icon-btn heart" aria-label="Love" title="Love">

  </body>
</html>
