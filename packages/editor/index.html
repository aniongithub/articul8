<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>articul8 · editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <span class="mark">articul8 <em>editor</em></span>
        <button
          id="theme"
          class="icon-btn"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <g
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </g>
          </svg>
        </button>
      </header>

      <nav id="clips" class="pivot" aria-label="Clips" hidden></nav>

      <main id="work">
        <section id="stage-area">
          <div id="stage"></div>
        </section>

        <section id="tl-area">
          <div class="transport">
            <button
              id="play"
              class="icon-btn"
              type="button"
              data-playing="false"
              aria-label="Play"
              title="Play"
            >
              <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="5" width="4" height="14" fill="currentColor" />
                <rect x="14" y="5" width="4" height="14" fill="currentColor" />
              </svg>
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4l13 8-13 8V4z" fill="currentColor" />
              </svg>
            </button>
            <span id="time" class="status-meta">0</span>
          </div>
          <div class="tl-body">
            <div id="tl-outline" class="tl-outline">
              <div class="tl-outline-header">
                <select
                  id="clip-select"
                  class="clip-select"
                  aria-label="Clip"
                ></select>
              </div>
              <div id="tl-outline-rows"></div>
            </div>
            <div id="tl-canvas" class="tl-canvas"></div>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="eyebrow">editor</span>
        <span class="status-meta" id="status">v0 · lens</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
